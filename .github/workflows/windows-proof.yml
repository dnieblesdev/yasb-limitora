name: Native Windows proof

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

jobs:
  native-proof:
    runs-on: windows-latest
    timeout-minutes: 10
    env:
      YASB_NATIVE_EVIDENCE_PATH: native-proof.json
      PYTHONUTF8: "1"
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install the pinned runtime and test tools
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install "limitora==0.1.0"
          python -m pip install -e ".[opencode-go,test]"
      - name: Execute the selected native proof
        shell: pwsh
        run: |
          $rawLog = "native-proof.raw.log"
          & python -m pytest -q --strict-markers tests/test_windows_native_proof.py --junitxml=native-proof.xml *> $rawLog
          $proofExit = $LASTEXITCODE
          $exitClass = if ($proofExit -eq 0) { "zero" } else { "nonzero" }
          "YASB_NATIVE_PYTEST_EXIT=$exitClass" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          $candidates = @(
            [PSCustomObject]@{ Label = "raw-log"; Path = $rawLog },
            [PSCustomObject]@{ Label = "junit"; Path = "native-proof.xml" },
            [PSCustomObject]@{ Label = "evidence"; Path = "native-proof.json" }
          )
          $unsafeClasses = @()
          $scanFailed = $false
          foreach ($candidate in $candidates) {
            if (Test-Path $candidate.Path) {
              try {
                $content = [IO.File]::ReadAllText((Resolve-Path $candidate.Path))
                if ($content.Contains("native-redaction-sentinel")) {
                  $unsafeClasses += $candidate.Label
                  Remove-Item -Force -ErrorAction Stop $candidate.Path
                }
              } catch {
                $unsafeClasses += $candidate.Label
                $scanFailed = $true
              }
            }
          }
          $unsafeClasses = @($unsafeClasses | Select-Object -Unique)
          $allowedClasses = @("raw-log", "junit", "evidence")
          $invalidClasses = @($unsafeClasses | Where-Object { $_ -notin $allowedClasses })
          $classText = $unsafeClasses -join ","
          if ($invalidClasses.Count -gt 0) {
            throw "Native proof safety classification invalid; pytest_exit=$exitClass"
          }
          if ($scanFailed) {
            throw "Native proof safety cleanup failed; candidates=$classText; pytest_exit=$exitClass"
          }
          if ($unsafeClasses.Count -gt 0) {
            throw "Native proof safety failure; candidates=$classText; pytest_exit=$exitClass"
          }
          if (Test-Path $rawLog) {
            try {
              Get-Content $rawLog -ErrorAction Stop
              Remove-Item -Force -ErrorAction Stop $rawLog
            } catch {
              throw "Native proof diagnostics unavailable; pytest_exit=$exitClass"
            }
          }
          if ($proofExit -ne 0) {
            throw "Native proof test failed"
          }
          try {
            $report = [xml](Get-Content native-proof.xml -Raw)
          } catch {
            throw "Native proof JUnit report was invalid"
          }
          $suites = @($report.testsuites.testsuite)
          if ($suites.Count -eq 0 -and $report.testsuite) {
            $suites = @($report.testsuite)
          }
          $tests = 0
          $skipped = 0
          $failures = 0
          $errors = 0
          try {
            foreach ($suite in $suites) {
              $tests += [int]$suite.tests
              $skipped += [int]$suite.skipped
              $failures += [int]$suite.failures
              $errors += [int]$suite.errors
            }
          } catch {
            throw "Native proof JUnit counts were invalid"
          }
          if ($suites.Count -eq 0 -or $tests -lt 1 -or $skipped -ne 0 -or $failures -ne 0 -or $errors -ne 0) {
            throw "Native proof was skipped, deselected, or failed"
          }
          try {
            $evidence = Get-Content native-proof.json -Raw | ConvertFrom-Json
          } catch {
            throw "Native proof evidence was invalid"
          }
          if ($evidence.native -ne $true -or $evidence.ready_authorized -ne $true -or $evidence.tree_terminated -ne $true -or $evidence.streams_clean -ne $true) {
            throw "Native proof did not publish complete product evidence"
          }
      - name: Run the complete test suite
        shell: pwsh
        run: |
          $rawLog = "full-suite.raw.log"
          & python -m pytest -q --strict-markers tests *> $rawLog
          $suiteExit = $LASTEXITCODE
          $exitClass = if ($suiteExit -eq 0) { "zero" } else { "nonzero" }
          "YASB_NATIVE_PYTEST_EXIT=$exitClass" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          $candidates = @(
            [PSCustomObject]@{ Label = "raw-log"; Path = $rawLog },
            [PSCustomObject]@{ Label = "junit"; Path = "native-proof.xml" },
            [PSCustomObject]@{ Label = "evidence"; Path = "native-proof.json" }
          )
          $unsafeClasses = @()
          $scanFailed = $false
          foreach ($candidate in $candidates) {
            if (Test-Path $candidate.Path) {
              try {
                $content = [IO.File]::ReadAllText((Resolve-Path $candidate.Path))
                if ($content.Contains("native-redaction-sentinel")) {
                  $unsafeClasses += $candidate.Label
                  Remove-Item -Force -ErrorAction Stop $candidate.Path
                }
              } catch {
                $unsafeClasses += $candidate.Label
                $scanFailed = $true
              }
            }
          }
          $unsafeClasses = @($unsafeClasses | Select-Object -Unique)
          $allowedClasses = @("raw-log", "junit", "evidence")
          $invalidClasses = @($unsafeClasses | Where-Object { $_ -notin $allowedClasses })
          $classText = $unsafeClasses -join ","
          if ($invalidClasses.Count -gt 0) {
            throw "Full-suite safety classification invalid; pytest_exit=$exitClass"
          }
          if ($scanFailed) {
            throw "Full-suite safety cleanup failed; candidates=$classText; pytest_exit=$exitClass"
          }
          if ($unsafeClasses.Count -gt 0) {
            throw "Full-suite safety failure; candidates=$classText; pytest_exit=$exitClass"
          }
          try {
            Get-Content $rawLog -ErrorAction Stop
            Remove-Item -Force -ErrorAction Stop $rawLog
          } catch {
            throw "Full-suite diagnostics unavailable; pytest_exit=$exitClass"
          }
          if ($suiteExit -ne 0) {
            throw "Full test suite failed"
          }
      - name: Validate artifacts before publication
        if: always()
        shell: pwsh
        run: |
          $exitClass = $env:YASB_NATIVE_PYTEST_EXIT
          if ($exitClass -notin @("zero", "nonzero")) {
            $exitClass = "unknown"
          }
          $candidates = @(
            [PSCustomObject]@{ Label = "junit"; Path = "native-proof.xml" },
            [PSCustomObject]@{ Label = "evidence"; Path = "native-proof.json" }
          )
          $unsafeClasses = @()
          $scanFailed = $false
          foreach ($candidate in $candidates) {
            if (Test-Path $candidate.Path) {
              try {
                $content = [IO.File]::ReadAllText((Resolve-Path $candidate.Path))
                if ($content.Contains("native-redaction-sentinel")) {
                  $unsafeClasses += $candidate.Label
                  Remove-Item -Force -ErrorAction Stop $candidate.Path
                }
              } catch {
                $unsafeClasses += $candidate.Label
                $scanFailed = $true
              }
            }
          }
          $unsafeClasses = @($unsafeClasses | Select-Object -Unique)
          $allowedClasses = @("raw-log", "junit", "evidence")
          $invalidClasses = @($unsafeClasses | Where-Object { $_ -notin $allowedClasses })
          $classText = $unsafeClasses -join ","
          if ($invalidClasses.Count -gt 0) {
            throw "Final artifact safety classification invalid; pytest_exit=$exitClass"
          }
          if ($scanFailed -or $unsafeClasses.Count -gt 0) {
            throw "Final artifact safety failure; candidates=$classText; pytest_exit=$exitClass"
          }
      - name: Publish safe native evidence
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: native-windows-proof
          path: |
            native-proof.json
            native-proof.xml
