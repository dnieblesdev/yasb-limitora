name: Native Windows proof

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

jobs:
  r10-admission:
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      PYTHONUTF8: "1"
      QT_QPA_PLATFORM: offscreen
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up isolated Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Verify immutable lock before acquisition
        shell: pwsh
        run: python tests/r10_yasb_support.py verify-lock
      - name: Acquire and verify pinned source artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force .r10-admission | Out-Null
          $sources = @(
            @{ Url = "https://codeload.github.com/amnweb/yasb/tar.gz/ee8ea9e683f3a4c41a27476adaab4c799a856643"; Name = "yasb.tar.gz" },
            @{ Url = "https://codeload.github.com/amnweb/pyvda/tar.gz/5d549eb5f8427ec771af98ae7b2c7ee38b98da6a"; Name = "pyvda.tar.gz" },
            @{ Url = "https://codeload.github.com/Video-Nomad/qt-css-engine/tar.gz/2a178cf7c994c63cab46224554bedf21e9639541"; Name = "qt-css-engine.tar.gz" }
          )
          foreach ($source in $sources) {
            Invoke-WebRequest -Uri $source.Url -OutFile (Join-Path .r10-admission $source.Name)
          }
          python tests/r10_yasb_support.py verify-archives .r10-admission
      - name: Install only verified YASB sources and fixed runtime dependencies
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $installLog = Join-Path $env:RUNNER_TEMP "r10-admission-install.log"
          function Invoke-PythonChecked {
            param([string]$Label, [string[]]$Arguments)
            try { & python @Arguments *> $installLog; $exitCode = $LASTEXITCODE }
            catch { throw "$Label unavailable; diagnostics withheld" }
            if ($exitCode -ne 0) { throw "$Label failed; exit=$exitCode; diagnostics withheld" }
            Write-Host "$Label passed"
          }
          Invoke-PythonChecked "pip upgrade" @("-m", "pip", "install", "--upgrade", "pip")
          Invoke-PythonChecked "test/runtime dependency install" @("-m", "pip", "install", "pytest>=8,<9", "PyQt6==6.10.2", "pydantic==2.13.4", "pywin32==312")
          Invoke-PythonChecked "verified YASB source install" @("-m", "pip", "install", "--no-deps", ".r10-admission/pyvda.tar.gz", ".r10-admission/qt-css-engine.tar.gz", ".r10-admission/yasb.tar.gz")
      - name: Run R10 admission first with zero selected skips
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $rawLog = Join-Path $env:RUNNER_TEMP "r10-admission-pytest.raw.log"
          $scanLog = Join-Path $env:RUNNER_TEMP "r10-admission-scan.log"
          $statusPath = "r10-admission-status.json"
          $pytestArgs = @("-m", "pytest", "-q", "--strict-markers", "tests/test_r10_pinned_yasb_windows.py", "-k", "lock or admission", "--junitxml=r10-admission.xml")
          try { & python @pytestArgs *> $rawLog; $pytestExit = $LASTEXITCODE }
          catch { $pytestExit = 1 }
          try {
            & python tests/r10_yasb_support.py summarize-pytest $rawLog r10-admission.xml $pytestExit $statusPath *> $scanLog
            $scanExit = $LASTEXITCODE
          } catch { $scanExit = 1 }
          if ($scanExit -ne 0) {
            @{ schema = "r10-admission-status/v1"; pytest_exit = $pytestExit; privacy = "failed"; report = "withheld" } |
              ConvertTo-Json -Compress | Set-Content -LiteralPath $statusPath -Encoding utf8
            throw "R10 admission privacy scan failed; diagnostics withheld"
          }
          $status = Get-Content -LiteralPath $statusPath -Raw | ConvertFrom-Json
          Write-Host "R10 admission safe status: pytest_exit=$($status.pytest_exit); tests=$($status.tests); skipped=$($status.skipped); failures=$($status.failures); errors=$($status.errors); privacy=$($status.privacy)"
          if ($status.pytest_exit -ne 0 -or $status.tests -lt 1 -or $status.skipped -ne 0 -or $status.failures -ne 0 -or $status.errors -ne 0) { throw "R10 admission failed or was skipped; diagnostics withheld" }
      - name: Publish sanitized admission status
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r10-yasb-admission
          path: r10-admission-status.json
          if-no-files-found: ignore

  native-proof:
    needs: r10-admission
    runs-on: windows-latest
    timeout-minutes: 10
    env:
      YASB_NATIVE_EVIDENCE_PATH: native-proof.json
      YASB_NATIVE_CHECKPOINT_PATH: native-proof.checkpoint
      PYTHONUTF8: "1"
      YASB_R8_NATIVE_GATE: "1"
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install the pinned runtime and test tools
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install "limitora==0.1.0"
          python -m pip install -e ".[opencode-go,test]"
      - name: Execute selected proof and complete test suite
        shell: pwsh
        run: |
          . .github/workflows/windows-proof-functions.ps1
          if ($env:YASB_R8_NATIVE_GATE -ne "1") { throw "R8 native gate is not enabled" }
          $rawLog = "native-proof.raw.log"
          $proofExit = Invoke-NativePytestWmi -Mode "selected" -Phase "Native proof" -RawLogName $rawLog
          $exitClass = if ($proofExit -eq 0) { "zero" } else { "nonzero" }
          "YASB_NATIVE_PYTEST_EXIT=$exitClass" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          $scan = Scan-Candidates @(
            [PSCustomObject]@{ Label = "raw-log"; Path = $rawLog },
            [PSCustomObject]@{ Label = "junit"; Path = "native-proof.xml" },
            [PSCustomObject]@{ Label = "evidence"; Path = "native-proof.json" }
          )
          $proofCheckpoint = Read-NativeCheckpoint "Native proof" $exitClass
          "YASB_NATIVE_CHECKPOINT=$proofCheckpoint" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Assert-SafeScan $scan $exitClass "Native proof" $proofCheckpoint
          Emit-SafeLog $rawLog $exitClass "Native proof"
          if ($proofExit -ne 0) { throw "Native proof test failed; checkpoint=$proofCheckpoint" }
          if ($proofCheckpoint -ne "9") { throw "Native proof checkpoint incomplete; checkpoint=$proofCheckpoint" }
          try { $report = [xml](Get-Content native-proof.xml -Raw) } catch { throw "Native proof JUnit report was invalid" }
          $suites = @($report.testsuites.testsuite)
          if ($suites.Count -eq 0 -and $report.testsuite) { $suites = @($report.testsuite) }
          $tests = 0; $skipped = 0; $failures = 0; $errors = 0
          try {
            foreach ($suite in $suites) {
              $tests += [int]$suite.tests; $skipped += [int]$suite.skipped
              $failures += [int]$suite.failures; $errors += [int]$suite.errors
            }
          } catch { throw "Native proof JUnit counts were invalid" }
          if ($suites.Count -eq 0 -or $tests -lt 1 -or $skipped -ne 0 -or $failures -ne 0 -or $errors -ne 0) { throw "Native proof was skipped, deselected, or failed" }
          try { $evidence = Get-Content native-proof.json -Raw | ConvertFrom-Json } catch { throw "Native proof evidence was invalid" }
          if ($evidence.native -ne $true -or $evidence.ready_authorized -ne $true -or $evidence.tree_terminated -ne $true -or $evidence.streams_clean -ne $true) { throw "Native proof did not publish complete product evidence" }
          $rawLog = "full-suite.raw.log"
          $suiteExit = Invoke-NativePytestWmi -Mode "full" -Phase "Full-suite" -RawLogName $rawLog
          $exitClass = if ($suiteExit -eq 0) { "zero" } else { "nonzero" }
          "YASB_NATIVE_PYTEST_EXIT=$exitClass" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          $scan = Scan-Candidates @(
            [PSCustomObject]@{ Label = "raw-log"; Path = $rawLog },
            [PSCustomObject]@{ Label = "junit"; Path = "native-proof.xml" },
            [PSCustomObject]@{ Label = "evidence"; Path = "native-proof.json" }
          )
          $suiteCheckpoint = Read-NativeCheckpoint "Full-suite" $exitClass
          "YASB_NATIVE_CHECKPOINT=$suiteCheckpoint" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Assert-SafeScan $scan $exitClass "Full-suite" $suiteCheckpoint
          Emit-SafeLog $rawLog $exitClass "Full-suite"
          if ($suiteExit -ne 0) { throw "Full test suite failed; checkpoint=$suiteCheckpoint" }
      - name: Validate artifacts before publication
        if: always()
        shell: pwsh
        run: |
          . .github/workflows/windows-proof-functions.ps1
          $exitClass = $env:YASB_NATIVE_PYTEST_EXIT
          if ($exitClass -notin @("zero", "nonzero")) { $exitClass = "unknown" }
          $checkpoint = $env:YASB_NATIVE_CHECKPOINT
          if ($checkpoint -notin @("1", "2", "3", "4", "5", "6", "7", "8", "9", "unknown")) { $checkpoint = "unknown" }
          $scan = Scan-Candidates @(
            [PSCustomObject]@{ Label = "junit"; Path = "native-proof.xml" },
            [PSCustomObject]@{ Label = "evidence"; Path = "native-proof.json" }
          )
          Assert-SafeScan $scan $exitClass "Final artifact" $checkpoint
      - name: Publish safe native evidence
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: native-windows-proof
          path: |
            native-proof.json
            native-proof.xml
