[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "yasb-limitora"
version = "0.1.0"
description = "Native Windows JSON integration for the Limitora LLM provider library."
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "dnieblesdev", email = "dnieblesp@gmail.com"},
]
requires-python = ">=3.10"
classifiers = [
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = ["limitora==0.1.0"]

[project.optional-dependencies]
opencode-go = ["httpx<1,>=0.27"]
test = ["pytest>=8,<9"]

[tool.pytest.ini_options]
markers = [
    "windows_native: executable native Windows process-tree proof",
]

[project.scripts]
yasb-limitora = "yasb_limitora.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"
